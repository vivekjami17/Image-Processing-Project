# Full local stack: Postgres, LocalStack (S3), API, worker and the web UI.
#   docker compose up --build        → http://localhost:8080
name: image-uploads

x-backend-env: &backend-env
  DATABASE_URL: postgres://app:app@postgres:5432/images
  STORAGE_DRIVER: s3
  S3_BUCKET: images
  S3_REGION: us-east-1
  S3_ENDPOINT: http://localstack:4566
  # Signed URLs are opened by the browser, which reaches LocalStack via the host port.
  S3_PUBLIC_ENDPOINT: http://localhost:4566
  S3_FORCE_PATH_STYLE: "true"
  S3_CREATE_BUCKET: "true"
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  CORS_ORIGINS: http://localhost:8080
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: images
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d images"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"\\(available\\|running\\)\"'"]
      interval: 3s
      timeout: 3s
      retries: 40

  api:
    build: ./backend
    environment: *backend-env
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    build: ./backend
    command: ["node", "dist/worker.js"]
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: "2"
    depends_on:
      # The API applies migrations on start-up.
      api: { condition: service_healthy }
    deploy:
      replicas: 2

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
